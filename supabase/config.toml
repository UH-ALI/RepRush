# Local development config. Anything omitted falls back to the CLI's default, so
# this file only states what must NOT be the default plus the ports worth pinning.
#
# `supabase init` would have generated a much longer file. Do not paste one over
# this: the only setting here that carries a decision is `verify_jwt`, and a
# generated file would reset it to true and silently break the error contract.

project_id = "reprush"

[api]
enabled = true
# The port every Edge Function is served on locally:
#   http://127.0.0.1:54321/functions/v1/<name>
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# ---------------------------------------------------------------------------
# Auth — anonymous sign-in is ON, because the guest path is a contract promise.
# ---------------------------------------------------------------------------
# api-contract.md §Common rules: "every endpoint requires a Supabase auth bearer
# token; the guest path (A1) issues one too." With this off, `POST /auth/v1/signup`
# with an empty body returns `422 anonymous_provider_disabled` and a judge hits a
# signup wall — the one failure the guest-first decision exists to prevent.
#
# An earlier comment here claimed this was a dashboard-only GoTrue setting and not
# a config.toml key. That was wrong, and wrong in the expensive direction: it sent
# you looking for a UI that does not exist locally. `enable_anonymous_sign_ins` is
# a first-class key — the CLI's own generated default config ships it (as `false`)
# — and it reaches the container as GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED.
#
# Changing it needs `npx supabase start`, not a request-time reload: the value is
# baked into the auth container's environment when the CLI creates it.
#
# Known cliff, left at its default on purpose: anonymous sign-ins are rate limited
# to 30/hour/IP. The client reuses its persisted session, so normal use never
# approaches that, but a loop of fresh installs would. Raise `[auth.rate_limit]
# anonymous_users` for local dev only if that ever bites — not here, because this
# file is also what a hosted project deploys from.
[auth]
enable_anonymous_sign_ins = true

# ---------------------------------------------------------------------------
# Edge Functions — verify_jwt is FALSE on every route, deliberately.
# ---------------------------------------------------------------------------
# When the runtime verifies the JWT it rejects a bad token with its own bare 401:
# no CORS headers and no `{ code, message }` body. The Flutter client cannot parse
# that and would surface an opaque network failure exactly where the contract
# promises `401 UNAUTHENTICATED` (api-contract.md §Common rules).
#
# Each route calls `requireUser()` in `_shared/auth.ts` instead, which round-trips
# to `auth.getUser` and throws into the shared envelope. The functions are still
# not public: no route does anything before it has a resolved user id.
[functions.session-start]
verify_jwt = false

[functions.session-submit]
verify_jwt = false

[functions.movements]
verify_jwt = false
